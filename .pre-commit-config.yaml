# Installed by `make setup`. Runs on every commit; `uv run pre-commit run --all-files` checks everything.
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-json
      - id: check-merge-conflict
      - id: check-added-large-files
      - id: detect-private-key
  - repo: local
    hooks:
      # Uses the ruff version pinned in uv.lock, so hooks and CI always agree.
      - id: ruff-check
        name: ruff check
        entry: uv run ruff check --fix
        language: system
        types: [python]
      - id: ruff-format
        name: ruff format
        entry: uv run ruff format
        language: system
        types: [python]
      - id: migrations
        name: migrations are up to date
        entry: uv run python manage.py makemigrations --check --dry-run --settings=config.settings.test
        language: system
        pass_filenames: false
        files: models\.py$
