name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: app
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d app"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DJANGO_SECRET_KEY: ci-only-not-secret-0123456789abcdef
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/app
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Install dependencies (exactly as locked)
        run: uv sync --frozen

      - name: Lint
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - name: Migrations are up to date
        run: uv run python manage.py makemigrations --check --dry-run
        env:
          DJANGO_SETTINGS_MODULE: config.settings.test

      - name: Deployment checks (check --deploy)
        run: uv run python manage.py check --deploy --fail-level WARNING
        env:
          DJANGO_SETTINGS_MODULE: config.settings.prod
          DJANGO_SECRET_KEY: ci-check-deploy-${{ github.run_id }}-a-long-random-looking-value-for-the-check
          DJANGO_ALLOWED_HOSTS: api.example.com
          DJANGO_CSRF_TRUSTED_ORIGINS: https://api.example.com
          DJANGO_DEFAULT_FROM_EMAIL: noreply@example.com
          FRONTEND_URL: https://app.example.com
          REDIS_URL: rediss://redis.example.com:6379/0
          AWS_REGION: ap-south-1
          AWS_STORAGE_BUCKET_NAME: ci-bucket
          CDN_DOMAIN: cdn.example.com

      - name: API schema is valid (no warnings)
        run: uv run python manage.py spectacular --validate --fail-on-warn --file /dev/null
        env:
          DJANGO_SETTINGS_MODULE: config.settings.test

      - name: Tests (with coverage minimum)
        run: uv run pytest --cov

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Check dependencies for known vulnerabilities
        run: |
          uv export --frozen --no-dev --no-hashes --no-emit-project -o requirements-audit.txt
          uvx pip-audit --strict --no-deps --disable-pip -r requirements-audit.txt

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build production image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          target: prod
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
